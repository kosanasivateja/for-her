<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - For Her</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>For Her</h1>

        <h2>Login</h2>

        <form method="POST">

            <input
                type="text"
                name="personal_id"
                placeholder="Your Personal ID"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Your Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

    </div>

</body>
</html>
